services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: resume-backend
    ports:
      - "8001:8001"
    # Use .env file
    env_file:
      - .env.example
    # Override Docker-specific values
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8001
      - DATA_DIR=/app/data
      - BACKEND_URL=http://backend:8001  # Docker internal URL
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./backend/src:/app/src
      - ./data:/app/data
      - backend-cache:/app/cache
    networks:
      - resume-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: resume-frontend
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - FRONTEND_HOST=0.0.0.0
      - FRONTEND_PORT=8000
      - BACKEND_URL=http://backend:8001  # Docker internal URL
    volumes:
      - ./frontend/src:/app/src
    networks:
      - resume-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  resume-network:
    name: resume-network
    driver: bridge

volumes:
  backend-cache:
    name: resume-backend-cache